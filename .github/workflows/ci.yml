name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # El panel compilado no se versiona: se construye aquí para que `npm test` ejerza la rama
      # estricta de test/entorno.test.ts (panel servido, enrutador y estáticos con su tipo).
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm test
