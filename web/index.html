<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Panel de Cobrix para operar la integración con el administrador de facturas del ISP." />
		<title>Cobrix · Sincronización con el ISP</title>
		<script>
			// Aplica el tema antes del primer pintado: sin parpadeo al recargar en oscuro.
			;(() => {
				const guardado = localStorage.getItem('cobrix-tema')
				const oscuro = guardado === 'oscuro' || (guardado !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
				document.documentElement.classList.toggle('dark', oscuro)
			})()
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
